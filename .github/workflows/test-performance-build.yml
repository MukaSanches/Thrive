name: Test performance build

on:
  push:
    branches:
      - test/graphics-performance-pass
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    container: thrive/godot-ci:v37
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Restore .NET dependencies
        run: dotnet restore Thrive.sln

      - name: Run compile checks
        run: dotnet run --project Scripts -- check compile

      - name: Download release native libraries
        run: dotnet run --project Scripts -- native Fetch Install --debug false

      - name: Install Godot export templates
        run: dotnet run --project Scripts -- godot-templates

      - name: Build Windows package
        run: dotnet run --project Scripts -- package Windows

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Thrive-performance-test-windows
          path: builds/*
          if-no-files-found: error
          retention-days: 7
