name: Test performance build

on:
  push:
    branches:
      - test/graphics-performance-pass
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Fetch upstream LFS assets
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Godot .NET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/bin"
          curl -L --fail --retry 3             -o "$RUNNER_TEMP/godot.zip"             "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot"
          GODOT_BIN="$(find "$HOME/godot" -type f -name 'Godot*_mono_linux.*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" "$HOME/.local/bin/godot-mono"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/godot-mono" --version

      - name: Restore .NET dependencies
        run: dotnet restore Thrive.sln

      - name: Run compile checks
        run: dotnet run --project Scripts -- check compile

      - name: Download release native libraries
        run: dotnet run --project Scripts -- native Fetch Install --debug false

      - name: Install Godot export templates
        run: dotnet run --project Scripts -- godot-templates

      - name: Build Windows package
        run: dotnet run --project Scripts -- package Windows

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Thrive-performance-test-windows
          path: builds/*
          if-no-files-found: error
          retention-days: 7
