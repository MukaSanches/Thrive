name: Validate PT-BR upstream-based translation

on:
  pull_request:
    branches:
      - translation/pt-br-100-upstream
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Restore .NET dependencies
        run: dotnet restore Thrive.sln

      - name: Validate Brazilian Portuguese PO file
        run: msgfmt --check --check-format locale/pt_BR.po -o /dev/null

      - name: Recalculate translation progress
        run: dotnet run --project Scripts -- translation-progress

      - name: Show generated translation progress diff
        run: git diff -- simulation_parameters/common/translations_info.json

      - name: Verify Brazilian Portuguese reached 100 percent
        run: jq -e '.TranslationProgress.pt_BR == 1' simulation_parameters/common/translations_info.json

      - name: Run compile check
        run: dotnet run --project Scripts -- check compile
