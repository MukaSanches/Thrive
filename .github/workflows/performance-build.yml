name: Performance build validation

on:
  push:
    branches:
      - performance_scalability

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          submodules: recursive

      - name: Fetch upstream LFS objects
        shell: bash
        run: |
          git remote add thrive-upstream https://github.com/Revolutionary-Games/Thrive.git
          git lfs install --local
          git lfs pull thrive-upstream master

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y gettext p7zip-full zip unzip

      - name: Install Godot .NET
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip -O /tmp/godot.zip
          mkdir -p "$HOME/godot" "$HOME/bin"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN="$(find "$HOME/godot" -type f -name 'Godot_v4.7.2-stable_mono_linux*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" "$HOME/bin/godot-mono"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: dotnet restore Thrive.sln

      - name: Install Godot export templates
        run: dotnet run --project Scripts -- godot-templates

      - name: Compile with project checks
        run: dotnet run --project Scripts -- check compile

      - name: Run repository consistency checks
        run: dotnet run --project Scripts -- check files localization steam-build rewrite

      - name: Install native libraries for tests
        run: dotnet run --project Scripts -- native Fetch Install --debug true

      - name: Run code-only tests
        run: dotnet run --project Scripts -- test --godot false

      - name: Import Godot resources for tests
        run: dotnet run --project Scripts -- godot-test-import

      - name: Run Godot tests
        continue-on-error: true
        run: dotnet run --project Scripts -- test --godot true --godot-reruns 1

      - name: Install release native libraries
        run: dotnet run --project Scripts -- native Fetch Install --debug false

      - name: Package Windows build
        env:
          CI_BRANCH: performance_scalability
        run: dotnet run --project Scripts -- package Windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Thrive-performance-Windows
          path: builds/**
          if-no-files-found: error
          compression-level: 0
